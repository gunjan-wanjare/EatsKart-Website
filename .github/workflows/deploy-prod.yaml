name: Deploy to Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}



      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
        env:
          NODE_ENV: staging

      - name: Verify dist folder
        run: |
          ls -la
          ls -la build

      - name: Deploy to S3
        run: |
          aws s3 sync build/ s3://${{ vars.AWS_S3_BUCKET }}/ \
            --delete

      - name: Configure CloudFront SPA error responses
        run: |
          DIST_ID="${{ secrets.AWS_CLOUDFRONT_ID }}"
          ETAG=$(aws cloudfront get-distribution-config --id "$DIST_ID" --query 'ETag' --output text)
          aws cloudfront get-distribution-config --id "$DIST_ID" --query 'DistributionConfig' > /tmp/dist-config.json

          python3 -c "
          import json
          with open('/tmp/dist-config.json') as f:
              config = json.load(f)
          config['CustomErrorResponses'] = {
              'Quantity': 2,
              'Items': [
                  {
                      'ErrorCode': 403,
                      'ResponsePagePath': '/index.html',
                      'ResponseCode': '200',
                      'ErrorCachingMinTTL': 0
                  },
                  {
                      'ErrorCode': 404,
                      'ResponsePagePath': '/index.html',
                      'ResponseCode': '200',
                      'ErrorCachingMinTTL': 0
                  }
              ]
          }
          with open('/tmp/dist-config.json', 'w') as f:
              json.dump(config, f)
          "

          aws cloudfront update-distribution \
            --id "$DIST_ID" \
            --if-match "$ETAG" \
            --distribution-config file:///tmp/dist-config.json

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_ID }} \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "# Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "- Static files deployed from build/" >> $GITHUB_STEP_SUMMARY
